# Gold prompt set for playlist-curation evaluation.
#
# Each prompt carries hand-written expectations that are independent of the
# system's own intent parser, so deterministic metrics measure the whole
# pipeline (parse -> retrieve -> rank) against what a human meant:
#
#   genres_any:  a track "hits" if any of its genre labels contains one of these
#   avoid:       genre/title keywords that should NOT appear (negative constraints)
#   era:         [first_year, last_year] the request implies
#   targets:     audio-feature ranges the request implies (0-1; tempo in BPM)
#   arc:         expected energy shape across the playlist: build | cooldown | peak | wave
#   profile:     offline listener profile (profiles/<name>.json)
#
# Fields are optional; a metric is only computed for prompts that define it.
# Genre keywords were checked against the catalog so every target is achievable.

defaults:
  length: 15
  profile: default

prompts:
  # --- mood ----------------------------------------------------------------
  - id: mood-01
    category: mood
    prompt: sad songs for a breakup
    targets: {valence: [0.0, 0.4]}
  - id: mood-02
    category: mood
    prompt: happy feel-good songs to put me in a good mood
    targets: {valence: [0.6, 1.0], energy: [0.5, 1.0]}
  - id: mood-03
    category: mood
    prompt: dark and brooding music for a stormy night
    targets: {valence: [0.0, 0.35]}
  - id: mood-04
    category: mood
    prompt: calm, peaceful music to unwind after a long day
    targets: {energy: [0.0, 0.45]}
  - id: mood-05
    category: mood
    prompt: angry songs to scream along to
    genres_any: [metal, punk, rock, rap]
    targets: {energy: [0.75, 1.0], valence: [0.0, 0.5]}
  - id: mood-06
    category: mood
    prompt: dreamy, hazy songs that feel like floating
    genres_any: [dream pop, shoegaze, ambient, psychedelic]
    targets: {energy: [0.0, 0.6]}
  - id: mood-07
    category: mood
    prompt: nostalgic songs that feel like summer as a teenager
    targets: {valence: [0.45, 1.0]}
  - id: mood-08
    category: mood
    prompt: romantic slow songs for a candlelit dinner
    genres_any: [soul, r&b, jazz, quiet storm]
    targets: {energy: [0.0, 0.5]}
  - id: mood-09
    category: mood
    prompt: hopeful, uplifting songs for a fresh start
    targets: {valence: [0.5, 1.0]}
  - id: mood-10
    category: mood
    prompt: lonely late-night songs, melancholic but beautiful
    targets: {valence: [0.0, 0.4], energy: [0.0, 0.55]}

  # --- activity ------------------------------------------------------------
  - id: act-01
