[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-agentic-curator"
version = "0.4.0"
description = "Agentic playlist curator: tool-calling retrieval, LLM ranking, an evaluation harness and prompt-injection defenses, exposed over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jatin Sainani" }]
dependencies = [
    "typer>=0.9.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "httpx>=0.25.0,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=14.0.0",
    "nltk>=3.8.0,<4.0.0",
    "pyyaml>=6.0",
    "langchain-core>=0.3.0,<1.0.0",
    "langchain-ollama>=0.2.0,<1.0.0",
    "langchain-anthropic>=0.3.0,<1.0.0",
    "langgraph>=0.2.0,<1.0.0",
    "mcp>=2.3.0,<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0,<8.0.0", "pytest-asyncio>=0.21.0,<1.0.0", "ruff>=0.6"]

[project.scripts]
curator = "app.__main__:app"
curator-mcp = "app.mcp_server:serve"

[tool.setuptools.packages.find]
include = ["app*", "core*", "evals*"]

[tool.setuptools.package-data]
"app.agent" = ["mood_priors.json"]
"evals" = ["prompts.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Emitted by langgraph's checkpoint serializer on import; not actionable here.
    "ignore:The default value of `allowed_objects`:DeprecationWarning",
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data", "exports"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
    "E501",   # long strings in prompts/docs; formatting handles code
    "B008",   # typer.Option(...) in defaults is the Typer idiom
    "UP007",  # keep Optional[...] for readability alongside Pydantic models
    "UP006", "UP035",  # typing.List/Dict kept consistent with existing modules
    "UP045",  # same as UP007 for Optional
    "UP042",  # str + Enum kept for Pydantic compatibility
    "B904",   # legacy modules re-raise user-facing ValueErrors; tracebacks are logged
    "B905",   # zip() strictness: lengths are aligned by construction
]

[tool.ruff.lint.isort]
known-first-party = ["app", "core", "evals"]
